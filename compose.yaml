# Docker Compose of the Agent Broker.
# update.sh builds the image and runs this file. It sets these variables:
#   AGENT_BROKER_VAULT   the folder of vault-agent_broker on the host (found with dependencies.txt)
#   DOCKER_GID           the group ID of the Docker socket on the host
#   AGENT_BROKER_COMMIT, AGENT_BROKER_COMMIT_DATE, AGENT_BROKER_COMMIT_SUBJECT   the commit of the image
# AGENT_BROKER_DOCKER_SOCKET (optional) is the path of the Docker socket on the host.
name: agent_broker

services:
  broker:
    container_name: agent_broker
    image: agent-broker:latest
    build:
      context: .local_assets/build
      dockerfile: workspace/projects/gustaw/gustaw_agent_broker/components/broker_service/Dockerfile
      args:
        AGENT_BROKER_COMMIT: ${AGENT_BROKER_COMMIT:-unknown}
        AGENT_BROKER_COMMIT_DATE: ${AGENT_BROKER_COMMIT_DATE:-}
        AGENT_BROKER_COMMIT_SUBJECT: ${AGENT_BROKER_COMMIT_SUBJECT:-}
    network_mode: host
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    user: "1000:1000"
    group_add:
      - "${DOCKER_GID:?run update.sh}"
    volumes:
      - ${AGENT_BROKER_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      # Read-write: the vault tool writes the access log of the vault.
      - ${AGENT_BROKER_VAULT:?run update.sh}:/workspace/vaults/vault-agent_broker
      # The optional local configuration: local.yaml in this folder.
      - ./components/broker_service/.local_assets/config:/workspace/projects/gustaw/gustaw_agent_broker/components/broker_service/.local_assets/config:ro
