# Docker Compose of the Agent Broker. Portable: this file holds no host value.
# prepare.sh copies this file into the deploy folder ${HOME}/containers/agent_broker/ and writes .env beside it.
# update.sh builds the image agent_broker:latest. The process runs as the user of prepare.sh, with the group of the
# Docker socket. HOME is a tmpfs; the folders below it are host folders. A host with a vault adds it with compose.override.yaml.
name: agent_broker

services:
  broker:
    container_name: agent_broker
    image: agent_broker:latest
    network_mode: host
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    user: "${HOST_UID:?run prepare.sh}:${HOST_GID:?run prepare.sh}"
    group_add:
      - "${DOCKER_GID:?run prepare.sh}"
    # The secrets without a vault: AGENT_BROKER_API_USERNAME, AGENT_BROKER_API_PASSWORD and AGENT_BROKER_TLS_PRIVATE_KEY_FILE.
    env_file:
      - path: ${HOST_CONFIG_HOME:?run prepare.sh}/gustaw/agent_broker/agent_broker.env
        required: false
    environment:
      HOME: /home/gustaw/agent_broker
    # HOME also holds the scratch folder of the TLS key.
    tmpfs:
      - /home/gustaw/agent_broker:uid=${HOST_UID},gid=${HOST_GID},mode=0700
    volumes:
      - type: bind
        source: ${AGENT_BROKER_DOCKER_SOCKET:?run prepare.sh}
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      # The configuration: the optional local.yaml.
      - type: bind
        source: ${HOST_CONFIG_HOME:?run prepare.sh}/gustaw/agent_broker
        target: /home/gustaw/agent_broker/.config/gustaw/agent_broker
        read_only: true
        bind:
          create_host_path: false
