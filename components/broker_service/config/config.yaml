# Default configuration of the broker service.
# It holds no secrets. Relative paths start at the folder of the component broker_service.
server:
  host: 0.0.0.0              # BROKER_HOST
  port: 38443                # BROKER_PORT

# The two supported agents, with all their settings. A local file can change each value, also `enabled`.
# A local file cannot add an agent. The service does not serve an agent with `enabled: false`.
# The provider of each agent: agent_api or opencode. The provider opencode needs the secret opencode_password and
# workspace_root: the folder of the workspaces in the container of OpenCode.
agents:
  claude:
    enabled: true
    provider: agent_api
    url: http://127.0.0.1:38444
    container: claude_code_server
  opencode:
    enabled: false           # a host enables it in local.yaml
    provider: opencode
    url: http://127.0.0.1:4096
    container: opencode
    workspace_root: /home/opencode/workspace

log:
  level: INFO                # LOG_LEVEL: ERROR, WARNING, INFO or DEBUG

streams:
  heartbeat_interval_s: 15   # HEARTBEAT_INTERVAL
  heartbeat_timeout_s: 45    # HEARTBEAT_TIMEOUT
  queue_limit: 100           # STREAM_QUEUE_LIMIT: waiting events of a client stream

docker:
  socket: /var/run/docker.sock   # DOCKER_SOCKET

language:
  languages: [en, pl]        # LANGUAGES
  threshold: 0.70            # LANGUAGE_THRESHOLD

# The certificate of the host. A relative path starts at the configuration folder of local.yaml.
# certtool of the component client makes it.
cert:
  file: server.crt

# Without credentials.vault, each secret comes from its environment variable env, or from the file of <env>_FILE.
# Give the private key with <env>_FILE: an env file cannot hold a value of more than one line.
# With credentials.vault (the name of a vault in local.yaml), each secret comes from the vault; dependencies.txt finds it.
credentials:
  vault: ""                          # empty: no vault; or the name of the vault
  secrets:
    tls_private_key: {entry: "Agent Broker TLS 01", key: private_key, env: AGENT_BROKER_TLS_PRIVATE_KEY}
    api_username: {entry: "Agent Broker API 01", key: username, env: AGENT_BROKER_API_USERNAME}
    api_password: {entry: "Agent Broker API 01", key: password, env: AGENT_BROKER_API_PASSWORD}
    opencode_password: {entry: "OpenCode API token", key: password, env: AGENT_BROKER_OPENCODE_PASSWORD}
