[mypy]
# Rule typed-code: strict mode, no explicit Any. The cache stays in .local_assets/.
strict = True
disallow_any_explicit = True
cache_dir = .local_assets/mypy-cache
mypy_path = src
files = src, tests, conftest.py

# These packages ship no type information.
[mypy-ruamel.*,jsonschema.*,keyring.*]
ignore_missing_imports = True
